repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # Lint (with autofix) then format, per Ruff's recommended ordering.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      # Static analysis for common Python security issues. Tests are excluded
      # because their asserts (B101) are expected, not a vulnerability.
      - id: bandit
        exclude: ^tests/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scan staged changes for committed secrets (API keys, tokens, etc.).
      - id: gitleaks
